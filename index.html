<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.5/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const PADS = [
        { key: "Q", id: "Heater-1", name: "Heater 1", src: "Heater-1.mp3" },
        { key: "W", id: "Heater-2", name: "Heater 2", src: "Heater-2.mp3" },
        { key: "E", id: "Heater-3", name: "Heater 3", src: "Heater-3.mp3" },
        { key: "A", id: "Heater-4", name: "Heater 4", src: "Heater-4_1.mp3" },
        { key: "S", id: "Clap", name: "Clap", src: "Clap.mp3" },
        { key: "D", id: "Open-HH", name: "Open HH", src: "Dsc_Oh.mp3" },
        { key: "Z", id: "Kick-n-Hat", name: "Kick n' Hat", src: "Kick_n_Hat.mp3" },
        { key: "X", id: "Kick", name: "Kick", src: "RP4_KICK_1.mp3" },
        { key: "C", id: "Closed-HH", name: "Closed HH", src: "Cev_H2.mp3" },
      ];

      function App() {
        const [display, setDisplay] = useState("Press a key");
        const [activeKey, setActiveKey] = useState("");

        function play(pad) {
          const audio = document.getElementById(pad.key);
          audio.currentTime = 0;
          const result = audio.play();
          if (result && result.catch) result.catch(() => {});

          setDisplay(pad.name);
          setActiveKey(pad.key);
          setTimeout(() => setActiveKey(""), 120);
        }

        useEffect(() => {
          function handleKey(e) {
            const pad = PADS.find((p) => p.key === e.key.toUpperCase());
            if (pad) play(pad);
          }
          document.addEventListener("keydown", handleKey);
          return () => document.removeEventListener("keydown", handleKey);
        }, []);

        return (
          <div id="drum-machine">
            <div id="display">{display}</div>
            <div className="pads">
              {PADS.map((pad) => (
                <div
                  key={pad.key}
                  id={pad.id}
                  className={"drum-pad" + (activeKey === pad.key ? " active" : "")}
                  onClick={() => play(pad)}
                >
                  {pad.key}
                  <audio className="clip" id={pad.key} src={pad.src}></audio>
                </div>
              ))}
            </div>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>

    <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
  </body>
</html>
